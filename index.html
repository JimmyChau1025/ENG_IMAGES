<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小紫的生字旅程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        #flashcard { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        #flashcard.flipped { transform: rotateY(180deg); }
        
        .progress-transition { transition: width 0.4s ease-out; }
        .btn-press { transition: all 0.1s; }
        .btn-press:active { transform: translateY(4px); box-shadow: 0 0px 0 0; }
        
        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center">

    <!-- 首頁 / 難度選擇 -->
    <div id="homeScreen" class="w-full min-h-screen flex flex-col items-center justify-end pb-12 sm:pb-20 px-4 bg-center bg-no-repeat transition-all duration-500 absolute inset-0 z-50">
        <div class="w-full max-w-sm flex flex-col gap-4 bg-white/20 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/30">
            <h2 class="text-center text-white font-bold text-xl mb-2 drop-shadow-md">選擇挑戰字數</h2>
            <button onclick="startGame(30)" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-900 font-bold py-4 rounded-2xl shadow-[0_4px_0_#b45309] active:shadow-none active:translate-y-1 transition-all text-lg">
                小菜一碟 (30)
            </button>
            <button onclick="startGame(60)" class="w-full bg-slate-500 hover:bg-slate-600 text-white font-bold py-4 rounded-2xl shadow-[0_4px_0_#334155] active:shadow-none active:translate-y-1 transition-all text-lg">
                大戰一百回合 (60)
            </button>
            <button onclick="startGame(100)" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 rounded-2xl shadow-[0_4px_0_#581c87] active:shadow-none active:translate-y-1 transition-all text-lg">
                準備掉手掣 (100)
            </button>
        </div>
    </div>

    <!-- 預載進度提示 (首頁頂部) -->
    <div id="preloadStatus" class="absolute top-4 left-0 right-0 text-center text-white/80 text-sm font-medium z-50 drop-shadow-md">
        正在準備魔法圖庫... <span id="preloadPct">0</span>%
    </div>

    <!-- 主要學習介面 -->
    <div id="app" class="w-full max-w-2xl h-screen flex flex-col hidden p-3 sm:p-6 bg-slate-50">
        
        <!-- 一體化頂部資訊欄 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-3 sm:p-4 mb-4 sm:mb-6 flex flex-row items-center justify-between shrink-0">
            <!-- 進度條 -->
            <div class="flex flex-col gap-1 w-1/3 pl-2">
                <div class="text-xs font-bold text-gray-500" id="cardCounter">0 / 0</div>
                <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-blue-500 progress-transition" style="width: 0%;"></div>
                </div>
            </div>
            
            <!-- 3鍵狀態統計 -->
            <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-bold">
                <div class="text-orange-600 bg-orange-50 px-2 py-1 rounded border border-orange-100 flex gap-1 items-center"><i class="ph-fill ph-warning-circle hidden sm:block"></i><span id="countHard">0</span></div>
                <div class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 flex gap-1 items-center"><i class="ph-fill ph-check-circle hidden sm:block"></i><span id="countGood">0</span></div>
                <div class="text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100 flex gap-1 items-center"><i class="ph-fill ph-star hidden sm:block"></i><span id="countEasy">0</span></div>
            </div>
            
            <!-- 功能按鈕 -->
            <div class="flex items-center gap-1">
                <button onclick="openHistoryModal()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                    <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
                </button>
                <button onclick="openShortcutsModal()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                    <i class="ph-bold ph-info text-xl"></i>
                </button>
            </div>
        </div>

        <!-- 卡片區域 -->
        <div class="flex-1 relative w-full perspective-1000 min-h-0 flex items-stretch cursor-pointer select-none mb-4" onclick="flipCard()">
            <div id="flashcard" class="relative w-full h-full transform-style-3d">
                
                <!-- 卡片正面 (魔法風格 + 隨機背景) -->
                <div id="cardFrontContainer" class="absolute inset-0 w-full h-full rounded-3xl shadow-xl flex flex-col items-center justify-center p-6 sm:p-10 backface-hidden">
                    <div id="frontContent" class="w-full text-center z-10 relative">
                        <!-- JS 動態插入內容 -->
                    </div>
                    <div id="frontInstruction" class="absolute bottom-5 text-purple-600 text-sm font-bold bg-white/70 px-4 py-1.5 rounded-full shadow-sm flex items-center gap-1.5 backdrop-blur-sm">
                        <i class="ph-bold ph-magic-wand"></i> 點擊施展魔法翻牌 (或按 Space)
                    </div>
                </div>

                <!-- 卡片背面 (夢幻粉紫漸層) -->
                <div id="cardBack" class="absolute inset-0 w-full h-full bg-gradient-to-br from-pink-50 to-purple-50 rounded-3xl shadow-xl p-6 sm:p-10 flex flex-col backface-hidden rotate-y-180 overflow-y-auto no-scrollbar border border-pink-100">
                    <div id="backContent" class="flex-1 flex flex-col h-full z-10 relative">
                        <!-- JS 動態插入內容 -->
                    </div>
                </div>
                
            </div>
        </div>

        <!-- 控制按鈕 (明快 3 鍵) -->
        <div id="controlsContainer" class="w-full flex gap-2 sm:gap-3 shrink-0 hidden">
            <button onclick="rateCard(1)" class="flex-1 btn-press bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#9A3412] text-sm sm:text-lg tracking-wider">
                Hard (1)
            </button>
            <button onclick="rateCard(2)" class="flex-1 btn-press bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#065F46] text-sm sm:text-lg tracking-wider">
                Good (2)
            </button>
            <button onclick="rateCard(3)" class="flex-1 btn-press bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#1E40AF] text-sm sm:text-lg tracking-wider">
                Easy (3)
            </button>
        </div>
        
        <div id="showAnswerText" class="text-center text-gray-400 text-sm font-medium shrink-0 pt-2">
            按下 <kbd class="px-2 py-1 bg-slate-200 text-slate-600 rounded">Space</kbd> 顯示答案
        </div>
    </div>

    <!-- 完成練習 Modal -->
    <div id="completionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="w-full h-48 sm:h-56 bg-slate-100 rounded-2xl mb-6 overflow-hidden flex items-center justify-center">
                <!-- 終極防錯：直接命中 ENDGAME.jpeg，附加防快取參數 -->
                <img src="https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg?v=1" 
                     onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg?v=2';" 
                     alt="Completed" class="w-full h-full object-cover">
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">挑戰完成！</h2>
            <p class="text-slate-500 mb-6 font-medium">太棒了，你已徹底征服本次的單字！</p>
            
            <div class="bg-emerald-50 text-emerald-700 font-bold py-3 px-4 rounded-xl mb-6 flex items-center justify-center gap-2 border border-emerald-100">
                <i class="ph-fill ph-clock text-xl"></i>
                <span id="finalTimeText">總花費時間： 0分 0秒</span>
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-[0_4px_0_#1d4ed8] active:translate-y-1 active:shadow-none transition-all text-lg">
                返回主畫面
            </button>
        </div>
    </div>

    <!-- 遊玩紀錄 Modal -->
    <div id="historyModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="ph-bold ph-clock-counter-clockwise text-blue-500"></i> 遊玩紀錄</h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><i class="ph-bold ph-x"></i></button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto pr-2 space-y-2 no-scrollbar">
                <!-- JS 填入紀錄 -->
            </div>
        </div>
    </div>

    <!-- 快捷鍵說明 Modal -->
    <div id="shortcutsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="ph-bold ph-keyboard text-blue-500"></i> 快捷鍵說明</h3>
                <button onclick="closeShortcutsModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><i class="ph-bold ph-x"></i></button>
            </div>
            <ul class="space-y-4 text-sm text-gray-600 font-medium">
                <li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100"><span>顯示答案 / 翻面</span> <kbd class="px-3 py-1 bg-white border border-slate-200 rounded-lg shadow-sm font-bold text-slate-700">Space</kbd></li>
                <li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100"><span>播放發音</span> <kbd class="px-3 py-1 bg-white border border-slate-200 rounded-lg shadow-sm font-bold text-slate-700">Enter</kbd></li>
                <li class="flex justify-between items-center bg-orange-50 p-3 rounded-xl border border-orange-100"><span class="text-orange-700">選擇 Hard</span> <kbd class="px-3 py-1 bg-white border border-orange-200 rounded-lg shadow-sm font-bold text-orange-700">1</kbd></li>
                <li class="flex justify-between items-center bg-emerald-50 p-3 rounded-xl border border-emerald-100"><span class="text-emerald-700">選擇 Good</span> <kbd class="px-3 py-1 bg-white border border-emerald-200 rounded-lg shadow-sm font-bold text-emerald-700">2</kbd></li>
                <li class="flex justify-between items-center bg-blue-50 p-3 rounded-xl border border-blue-100"><span class="text-blue-700">選擇 Easy</span> <kbd class="px-3 py-1 bg-white border border-blue-200 rounded-lg shadow-sm font-bold text-blue-700">3</kbd></li>
            </ul>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;

        // 隨機卡面圖庫 (桌機橫圖 vs 手機直圖)
        const frontBackgrounds = [
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg1.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg2.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg3.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg4.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg5.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bg6.jpeg'
        ];

        const frontBackgroundsMobile = [
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm1.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm2.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm3.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm4.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm5.jpeg',
            'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/bgm6.jpeg'
        ];

        const vocabularyData = [
            { word: "Conscious", pos: "adj.", def: "意識到的；察覺到的", example: "He was conscious of a presence behind him.", translation: "他感覺到身後有人。" },
            { word: "Essential", pos: "adj.", def: "必要的；必不可少的", example: "Water is essential for living things.", translation: "水對生物來說是不可或缺的。" },
            { word: "Maintain", pos: "v.", def: "維持；保持", example: "We must maintain our friendly relations.", translation: "我們必須保持友好的關係。" },
            { word: "Annual", pos: "adj.", def: "每年的；一年一次的", example: "The company holds an annual meeting in March.", translation: "公司在三月舉行年會。" },
            { word: "Predict", pos: "v.", def: "預測；預言", example: "It's hard to predict what will happen next.", translation: "很難預測接下來會發生什麼。" },
            { word: "Significant", pos: "adj.", def: "重要的；顯著的", example: "There was a significant increase in sales.", translation: "銷售額有顯著的增長。" },
            { word: "Evaluate", pos: "v.", def: "評估；評價", example: "We need to evaluate the success of the campaign.", translation: "我們需要評估這次活動的成功與否。" },
            { word: "Assume", pos: "v.", def: "假設；認為", example: "I assume you have read the report.", translation: "我假設你已經讀過這份報告了。" },
            { word: "Strategy", pos: "n.", def: "策略；戰略", example: "They discussed their business strategy.", translation: "他們討論了商業策略。" },
            { word: "Implement", pos: "v.", def: "實施；執行", example: "The new policy will be implemented next month.", translation: "新政策將於下個月實施。" },
            { word: "Alternative", pos: "n.", def: "替代方案", example: "We have no alternative but to go on.", translation: "我們別無選擇，只能繼續前進。" },
            { word: "Benefit", pos: "n.", def: "利益；好處", example: "The new park is a benefit to the community.", translation: "新公園對社區有益。" },
            { word: "Concept", pos: "n.", def: "概念；觀念", example: "She explained the concept of gravity.", translation: "她解釋了引力的概念。" },
            { word: "Context", pos: "n.", def: "背景；上下文", example: "This word must be understood in context.", translation: "這個詞必須在上下文中理解。" },
            { word: "Determine", pos: "v.", def: "決定；確定", example: "Your attitude determines your altitude.", translation: "你的態度決定你的高度。" },
            { word: "Environment", pos: "n.", def: "環境", example: "We must protect the environment.", translation: "我們必須保護環境。" },
            { word: "Factor", pos: "n.", def: "因素", example: "Price is a major factor in our decision.", translation: "價格是我們決定的主要因素。" },
            { word: "Identify", pos: "v.", def: "識別；認出", example: "Can you identify the man in the photo?", translation: "你能認出照片中的人嗎？" },
            { word: "Indicate", pos: "v.", def: "表明；指示", example: "The map indicates where the treasure is.", translation: "地圖標示了寶藏的位置。" },
            { word: "Method", pos: "n.", def: "方法", example: "He discovered a new method of teaching.", translation: "他發現了一種新的教學方法。" },
            { word: "Occur", pos: "v.", def: "發生", example: "The accident occurred at 5 PM.", translation: "事故發生在下午5點。" },
            { word: "Process", pos: "n.", def: "過程", example: "Learning a language is a slow process.", translation: "學習語言是一個緩慢的過程。" },
            { word: "Require", pos: "v.", def: "需要；要求", example: "This job requires a lot of patience.", translation: "這份工作需要很多耐心。" },
            { word: "Research", pos: "n.", def: "研究", example: "She is doing research on cancer.", translation: "她正在進行癌症研究。" },
            { word: "Role", pos: "n.", def: "角色；作用", example: "Education plays an important role in society.", translation: "教育在社會中扮演重要角色。" },
            { word: "Similar", pos: "adj.", def: "相似的", example: "Your shoes are similar to mine.", translation: "你的鞋子和我的很相似。" },
            { word: "Source", pos: "n.", def: "來源", example: "Sun is the source of energy.", translation: "太陽是能量的來源。" },
            { word: "Specific", pos: "adj.", def: "具體的；特定的", example: "Can you be more specific?", translation: "你能具體一點嗎？" },
            { word: "Vary", pos: "v.", def: "變化；不同", example: "Prices vary depending on the season.", translation: "價格隨季節而變化。" },
            { word: "Achieve", pos: "v.", def: "實現；達到", example: "You can achieve anything if you work hard.", translation: "只要努力，你可以實現任何事情。" },
            { word: "Acquire", pos: "v.", def: "獲得；學到", example: "He acquired a lot of knowledge from books.", translation: "他從書本上獲得了很多知識。" },
            { word: "Adjust", pos: "v.", def: "調整；適應", example: "It took time to adjust to the new climate.", translation: "適應新氣候需要時間。" },
            { word: "Analyze", pos: "v.", def: "分析", example: "We need to analyze the data carefully.", translation: "我們需要仔細分析數據。" },
            { word: "Approach", pos: "n.", def: "方法；途徑", example: "We need a new approach to the problem.", translation: "我們需要解決這個問題的新方法。" },
            { word: "Assess", pos: "v.", def: "評估", example: "The teacher assessed the students' progress.", translation: "老師評估了學生的進步。" },
            { word: "Available", pos: "adj.", def: "可用的；有空的", example: "Is this seat available?", translation: "這個位子有人嗎？" },
            { word: "Category", pos: "n.", def: "類別", example: "These books fall into a different category.", translation: "這些書屬於不同的類別。" },
            { word: "Complex", pos: "adj.", def: "複雜的", example: "The human brain is very complex.", translation: "人類的大腦非常複雜。" },
            { word: "Conclusion", pos: "n.", def: "結論", example: "I came to the conclusion that he was lying.", translation: "我得出的結論是他在說謊。" },
            { word: "Sequence", pos: "n.", def: "順序；一系列", example: "The events followed a logical sequence.", translation: "事件按照邏輯順序發生。" }
        ];

        let queue = [];
        let totalCards = 0;
        let learnedCards = 0; 
        
        let stats = { hard: 0, good: 0, easy: 0 };
        let cardHistory = {};
        
        let isFlipped = false;
        let currentMode = 0; // 0: 單字, 1: 填空, 2: 聽力
        let startTime = 0;

        function preloadImages() {
            const allImages = [...frontBackgrounds, ...frontBackgroundsMobile, 'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg?v=1'];
            let loadedCount = 0;
            const pctEl = document.getElementById('preloadPct');
            const statusEl = document.getElementById('preloadStatus');

            allImages.forEach(src => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loadedCount++;
                    if (pctEl) pctEl.innerText = Math.floor((loadedCount / allImages.length) * 100);
                    if (loadedCount === allImages.length && statusEl) {
                        statusEl.style.display = 'none';
                    }
                };
                img.src = src;
            });
        }

        function loadBackgroundImage() {
            const isMobile = window.innerWidth < 640;
            // 如果是手機，用直圖 (請確保 GitHub 上有 TITLE_MOBILE.jpeg)；平板/電腦用橫圖 TITLE.jpg
            const bgUrl = isMobile 
                ? 'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE_MOBILE.jpeg'
                : 'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.jpg';
            
            document.getElementById('homeScreen').style.backgroundImage = `url('${bgUrl}')`;
            document.getElementById('homeScreen').style.backgroundSize = 'cover';
        }

        function startGame(amount) {
            startTime = Date.now();
            let selectedWords = [...vocabularyData].sort(() => 0.5 - Math.random()).slice(0, amount);
            
            totalCards = amount;
            learnedCards = 0;
            queue = selectedWords.map(word => [word.word, word]);
            stats = { hard: 0, good: 0, easy: 0 };
            cardHistory = {};
            
            document.getElementById('homeScreen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('homeScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('flex');
                updateStatsUI();
                nextCard();
            }, 500);
        }

        function nextCard() {
            if (queue.length === 0) {
                endGame();
                return;
            }
            
            isFlipped = false;
            const card = queue[0];
            const wordData = card[1];
            
            const cardFrontContainer = document.getElementById('cardFrontContainer');
            const frontContent = document.getElementById('frontContent');
            const backContent = document.getElementById('backContent');
            
            const flashcard = document.getElementById('flashcard');
            if (flashcard) flashcard.classList.remove('flipped');
            
            const controlsContainer = document.getElementById('controlsContainer');
            if (controlsContainer) {
                controlsContainer.classList.add('hidden');
                controlsContainer.classList.remove('flex');
            }
            
            const showAnswerText = document.getElementById('showAnswerText');
            if (showAnswerText) showAnswerText.classList.remove('hidden');

            // 響應式背景：手機用 bgm1-6，桌機用 bg1-6
            const isMobileBg = window.innerWidth < 640;
            const bgArray = isMobileBg ? frontBackgroundsMobile : frontBackgrounds;
            const randomBg = bgArray[Math.floor(Math.random() * bgArray.length)];
            
            // 強制 100% 貼齊邊緣不裁切
            cardFrontContainer.style.backgroundImage = `url('${randomBg}')`;
            cardFrontContainer.style.backgroundSize = '100% 100%';
            cardFrontContainer.style.backgroundPosition = 'center';
            cardFrontContainer.style.backgroundRepeat = 'no-repeat';

            currentMode = Math.floor(Math.random() * 3);
            let frontHTML = '';
            
            if (currentMode === 0) {
                // 魔法單字模式 (深紫字體)
                frontHTML = `
                    <div class="relative inline-block mt-4">
                        <div class="absolute -top-4 -left-4 text-pink-300 animate-pulse"><i class="ph-fill ph-sparkle text-2xl"></i></div>
                        <h2 class="text-4xl sm:text-6xl font-black text-purple-900 tracking-tight drop-shadow-sm">${wordData.word}</h2>
                        <div class="absolute -bottom-2 -right-4 text-purple-300 animate-pulse" style="animation-delay: 0.5s;"><i class="ph-fill ph-sparkle text-xl"></i></div>
                    </div>
                    <button id="frontSpeakBtn" onclick="speak('${wordData.word}', event)" class="absolute top-4 right-4 text-pink-400 hover:text-pink-500 bg-white/60 p-3 rounded-full shadow-sm backdrop-blur-sm transition-transform active:scale-90">
                        <i class="ph-bold ph-speaker-high text-2xl"></i>
                    </button>`;
            } else if (currentMode === 1) {
                // 櫻花填空模式
                const blankWord = wordData.word.replace(/[a-zA-Z]/g, '🌸');
                frontHTML = `
                    <div class="text-pink-400 font-bold mb-4 flex justify-center gap-1">
                        <i class="ph-fill ph-magic-wand text-xl"></i><span>填空施法</span>
                    </div>
                    <h2 class="text-3xl sm:text-5xl font-bold text-purple-900 tracking-wider mb-6 drop-shadow-sm">${blankWord}</h2>
                    <p class="text-lg sm:text-xl text-slate-700 font-medium px-4 bg-white/50 py-3 rounded-2xl inline-block shadow-sm">${wordData.translation}</p>
                    <button id="frontSpeakBtn" onclick="speak('${wordData.word}', event)" class="absolute top-4 right-4 text-pink-400 hover:text-pink-500 bg-white/60 p-3 rounded-full shadow-sm backdrop-blur-sm transition-transform active:scale-90">
                        <i class="ph-bold ph-speaker-high text-2xl"></i>
                    </button>`;
            } else if (currentMode === 2) {
                // 魔法聽力球模式
                frontHTML = `
                    <div class="text-purple-500 font-bold mb-8 flex justify-center gap-1">
                        <i class="ph-fill ph-headphones text-xl"></i><span>仔細聆聽魔法咒語</span>
                    </div>
                    <button id="frontSpeakBtn" onclick="speak('${wordData.word}', event)" class="w-24 h-24 sm:w-32 sm:h-32 bg-gradient-to-br from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white rounded-full flex items-center justify-center mx-auto shadow-[0_0_30px_rgba(236,72,153,0.4)] transition-transform active:scale-90 relative">
                        <div class="absolute inset-0 border-4 border-white/30 rounded-full animate-ping"></div>
                        <i class="ph-fill ph-speaker-high text-5xl"></i>
                    </button>`;
                setTimeout(() => speak(wordData.word, null), 300);
            }
            
            frontContent.innerHTML = frontHTML;
            renderCard(wordData, backContent);
            updateProgress();
        }

        function renderCard(wordData, container) {
            // 卡片背面：粉色藥丸標籤、深紫文字
            const backHTML = `
                <div class="flex-1 flex flex-col justify-center pb-10">
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-4 py-1.5 bg-pink-100 text-pink-700 rounded-full text-sm font-bold shadow-sm border border-pink-200">
                            ${wordData.pos}
                        </span>
                        <button id="backSpeakBtn" onclick="speak('${wordData.word}', event)" class="p-3 text-white bg-gradient-to-r from-pink-400 to-purple-500 rounded-full shadow-md hover:shadow-lg transition-transform active:scale-90 border-2 border-white">
                            <i class="ph-bold ph-speaker-high text-xl"></i>
                        </button>
                    </div>
                    <h2 class="text-4xl sm:text-5xl font-black text-purple-900 mb-4 tracking-tight drop-shadow-sm">${wordData.word}</h2>
                    <p class="text-xl sm:text-2xl text-slate-700 font-bold mb-8 pl-4 border-l-4 border-pink-300 bg-white/40 py-2 rounded-r-xl">${wordData.def}</p>
                    <div class="space-y-3 bg-white/60 p-4 sm:p-5 rounded-2xl shadow-sm border border-purple-50">
                        <p class="text-base sm:text-lg text-purple-800 font-medium leading-relaxed">${wordData.example}</p>
                        <p class="text-sm sm:text-base text-slate-500 font-medium">${wordData.translation}</p>
                    </div>
                </div>
            `;
            container.innerHTML = backHTML;
        }

        function speak(text, event) {
            if (event) event.stopPropagation();
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function flipCard() {
            if (isFlipped) return;
            isFlipped = true;
            
            const flashcard = document.getElementById('flashcard');
            const controlsContainer = document.getElementById('controlsContainer');
            const showAnswerText = document.getElementById('showAnswerText');
            
            if (flashcard) flashcard.classList.add('flipped');
            if (controlsContainer) {
                controlsContainer.classList.remove('hidden');
                controlsContainer.classList.add('flex');
            }
            if (showAnswerText) showAnswerText.classList.add('hidden');
            
            const backBtn = document.getElementById('backSpeakBtn');
            if (backBtn) {
                setTimeout(() => {
                    backBtn.click();
                }, 600);
            }
        }

        // 3 鍵模式: 1=Hard(重來), 2=Good(學會), 3=Easy(學會)
        function rateCard(rating) {
            if (queue.length === 0) return;
            const card = queue.shift();
            const word = card[0];
            
            if (!cardHistory[word]) {
                cardHistory[word] = { hardCount: 0 };
            }
            const history = cardHistory[word];
            
            if (rating === 1) { 
                stats.hard++;
                history.hardCount++;
                const midIndex = Math.floor(queue.length / 2);
                queue.splice(midIndex, 0, card);
            } else if (rating === 2) { 
                stats.good++;
                learnedCards++;
            } else if (rating === 3) { 
                stats.easy++;
                learnedCards++;
            }
            
            updateStatsUI();
            nextCard(); 
        }

        function updateProgress() {
            const cardCounter = document.getElementById('cardCounter');
            const progressBar = document.getElementById('progressBar');
            if (cardCounter) cardCounter.textContent = `${learnedCards} / ${totalCards}`;
            if (progressBar) {
                const progressPct = totalCards === 0 ? 0 : (learnedCards / totalCards) * 100;
                progressBar.style.width = `${progressPct}%`;
            }
        }

        function updateStatsUI() {
            const countHard = document.getElementById('countHard');
            const countGood = document.getElementById('countGood');
            const countEasy = document.getElementById('countEasy');
            
            if (countHard) countHard.textContent = stats.hard;
            if (countGood) countGood.textContent = stats.good;
            if (countEasy) countEasy.textContent = stats.easy;
        }

        function endGame() {
            const endTime = Date.now();
            const timeDiff = endTime - startTime;
            const totalSeconds = Math.floor(timeDiff / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const timeString = `${minutes}分 ${seconds}秒`;

            const finalTimeText = document.getElementById('finalTimeText');
            if (finalTimeText) finalTimeText.textContent = `總花費時間： ${timeString}`;

            saveHistoryRecord(totalCards, timeString);

            const modal = document.getElementById('completionModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function saveHistoryRecord(count, timeStr) {
            let history = JSON.parse(localStorage.getItem('vocabularyJourneyHistory') || '[]');
            const dateStr = new Date().toLocaleString('zh-TW', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
            
            history.unshift({ date: dateStr, count: count, time: timeStr });
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('vocabularyJourneyHistory', JSON.stringify(history));
        }

        function openHistoryModal() {
            const modal = document.getElementById('historyModal');
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('vocabularyJourneyHistory') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 py-4">尚未有遊玩紀錄</div>';
            } else {
                list.innerHTML = history.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 mb-2">
                        <div class="text-sm font-bold text-gray-700">${item.date}</div>
                        <div class="flex gap-2 text-sm">
                            <span class="text-blue-600 bg-blue-50 px-2 py-1 rounded font-bold">${item.count} 字</span>
                            <span class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded font-bold">${item.time}</span>
                        </div>
                    </div>
                `).join('');
            }
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function openShortcutsModal() {
            const modal = document.getElementById('shortcutsModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeShortcutsModal() {
            const modal = document.getElementById('shortcutsModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadBackgroundImage();
            window.addEventListener('resize', loadBackgroundImage);
            preloadImages();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                const startScreen = document.getElementById('homeScreen');
                if (startScreen && startScreen.classList.contains('hidden')) {
                    const flashcard = document.getElementById('flashcard');
                    if (flashcard) flashcard.click();
                }
            } else if (e.code === 'Enter') {
                e.preventDefault();
                if (!isFlipped) {
                    const frontBtn = document.getElementById('frontSpeakBtn');
                    if (frontBtn) frontBtn.click();
                } else {
                    const backBtn = document.getElementById('backSpeakBtn');
                    if (backBtn) backBtn.click();
                }
            } else if (isFlipped) {
                if (e.key === '1') rateCard(1);
                else if (e.key === '2') rateCard(2);
                else if (e.key === '3') rateCard(3);
            }
        });
    </script>
</body>
</html>
