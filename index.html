<body class="h-screen w-screen bg-gray-50 flex flex-col items-center p-2 sm:p-4 overflow-hidden font-sans text-gray-800">

    <div id="homeScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-end pb-8 sm:pb-12 bg-cover bg-center bg-no-repeat transition-opacity duration-700 bg-[#c5d0db]">

            </button>
            <button onclick="startGame(100)" class="flex-1 min-w-[160px] btn-press bg-[#8B5CF6]/95 hover:bg-[#8B5CF6] text-white font-bold py-3 px-4 rounded-xl shadow-[0_4px_0_#5B21B6] text-lg whitespace-nowrap">

            </button>

    <!-- -->

            <!-- 左側：進度條與數量 -->
            <div class="flex flex-col gap-1 w-1/3 pl-2">
                <div class="text-xs font-bold text-gray-500" id="cardCounter">0 / 0</div>
                <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-blue-500 progress-transition" style="width: 0%;"></div>
                </div>
            </div>
            
            <!-- 中間：分類點擊統計 -->
            <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-bold">
                <div class="text-red-600 bg-red-50 px-2 py-1 rounded border border-red-100 flex gap-1 items-center"><i class="ph-fill ph-x-circle hidden sm:block"></i><span id="countAgain">0</span></div>
                <div class="text-orange-600 bg-orange-50 px-2 py-1 rounded border border-orange-100 flex gap-1 items-center"><i class="ph-fill ph-warning-circle hidden sm:block"></i><span id="countHard">0</span></div>
                <div class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 flex gap-1 items-center"><i class="ph-fill ph-check-circle hidden sm:block"></i><span id="countGood">0</span></div>
                <div class="text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100 flex gap-1 items-center"><i class="ph-fill ph-star hidden sm:block"></i><span id="countEasy">0</span></div>
            </div>
            
            <!-- 右側：遊玩紀錄與說明按鈕 -->
            <div class="flex items-center gap-1">
                <button id="historyBtn" class="p-2 text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 rounded-lg transition-colors" title="遊玩紀錄">
                    <i class="ph-bold ph-clock-counter-clockwise text-lg sm:text-xl"></i>
                </button>
                <button id="infoBtn" class="p-2 text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 rounded-lg transition-colors" title="快速鍵說明">
                    <i class="ph-bold ph-info text-lg sm:text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Flashcard Area -->
        <div class="flex-1 relative w-full perspective-1000 min-h-0">
            <div id="flashcard" class="absolute inset-0 w-full h-full transform-style-3d card-transition cursor-pointer shadow-xl rounded-2xl">
                
                <!-- 卡片正面 -->
                <div class="absolute inset-0 bg-white rounded-2xl backface-hidden flex flex-col items-center justify-center p-4 border-2 border-gray-100">
                    <button id="frontSpeakBtn" class="absolute top-4 right-4 p-3 text-blue-500 hover:bg-blue-50 rounded-full transition-colors z-10">
                        <i class="ph-fill ph-speaker-high text-3xl sm:text-4xl"></i>
                    </button>
                    <div id="cardFrontText" class="text-5xl sm:text-6xl lg:text-7xl font-extrabold text-gray-800 text-center break-words w-full px-4">

                    </div>

                    </div>
                </div>
                
                <!-- 卡片背面 -->

                    <div id="cardBackContent" class="w-full h-full relative">
                        <!-- 內容將由 JavaScript 動態注入 -->
                    </div>
                    <!-- 朗讀例句按鈕 -->
                    <button id="backSpeakBtn" class="absolute bottom-4 right-4 p-3 bg-blue-500 text-white rounded-full shadow-lg hover:bg-blue-600 transition-colors z-10 flex items-center justify-center">
                        <i class="ph-fill ph-speaker-high text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 極簡化控制按鈕 -->
        <div id="controlsContainer" class="w-full flex gap-2 sm:gap-3 shrink-0 hidden">
            <button onclick="rateCard(1)" class="flex-1 btn-press bg-red-500 hover:bg-red-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#991B1B] text-sm sm:text-lg tracking-wider">
                Again
            </button>
            <button onclick="rateCard(2)" class="flex-1 btn-press bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#9A3412] text-sm sm:text-lg tracking-wider">
                Hard
            </button>
            <button onclick="rateCard(3)" class="flex-1 btn-press bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#065F46] text-sm sm:text-lg tracking-wider">
                Good
            </button>
            <button onclick="rateCard(4)" class="flex-1 btn-press bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 sm:py-3 rounded-xl shadow-[0_4px_0_#1E40AF] text-sm sm:text-lg tracking-wider">
                Easy
            </button>
        </div>
        
        <div id="showAnswerText" class="text-center text-gray-400 text-sm font-medium shrink-0">

        </div>

    <!-- 遊玩紀錄 Modal -->
    <div id="historyModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-2xl w-11/12 max-w-md shadow-2xl transform scale-95 transition-transform flex flex-col max-h-[80vh]" id="historyModalContent">

                    <i class="ph-fill ph-clock-counter-clockwise text-blue-500"></i> 遊玩紀錄 <span class="text-sm text-gray-400 font-normal">(近20次)</span>

                <hr class="my-3 border-gray-100">
                <li class="flex items-center justify-between"><span class="bg-red-50 text-red-600 border-red-200 px-2 py-1 rounded border font-bold">1 (Again)</span> <span>插回第 2 個位置 <span class="text-xs text-red-400">(進度不變)</span></span></li>
                <li class="flex items-center justify-between"><span class="bg-orange-50 text-orange-600 border-orange-200 px-2 py-1 rounded border font-bold">2 (Hard)</span> <span>插回中間位置 <span class="text-xs text-orange-400">(進度不變)</span></span></li>
                <li class="flex items-center justify-between"><span class="bg-emerald-50 text-emerald-600 border-emerald-200 px-2 py-1 rounded border font-bold">3 (Good)</span> <span>學會了！移出佇列 <span class="text-xs text-emerald-500">(進度+1)</span></span></li>
                <li class="flex items-center justify-between"><span class="bg-blue-50 text-blue-600 border-blue-200 px-2 py-1 rounded border font-bold">4 (Easy)</span> <span>太簡單！移出佇列 <span class="text-xs text-blue-500">(進度+1)</span></span></li>
                <hr class="my-3 border-gray-100">
                <li class="text-center text-xs text-blue-500 font-bold">✨ 當所有單字都移出佇列時，挑戰即算完成！</li>
            </ul>
            <button onclick="closeInfo()" class="mt-6 w-full py-3 bg-gray-800 text-white rounded-xl font-bold text-base hover:bg-gray-900 transition shadow-lg">了解！</button>
        </div>
    </div>

    <!-- 完成練習 Modal (加入 ENDGAME.JPG 與計時器) -->

            <!-- ENDGAME 圖片 -->

            </button>
        </div>

        function handleImageError(img) {

            if (!cleanWord) {

                return;
            }
            const trimmed = cleanWord.trim();
            const keyword = encodeURIComponent(trimmed);
            const lowerKeyword = encodeURIComponent(trimmed.toLowerCase());
            const capKeyword = encodeURIComponent(trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase());
            
            const rawUrls = [
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.JPG`,

        function saveSession() {

        function parseCSV(text) {
            let parsed = [];
            let row = [];
            let inQuotes = false;
            let currentValue = '';

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i+1];
                if (char === '"' && inQuotes && nextChar === '"') {
                    currentValue += '"'; i++; 
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue.trim());
                    currentValue = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++; 
                    row.push(currentValue.trim());
                    if (row.length >= 2 || row[0] !== '') parsed.push(row);
                    row = [];
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            if (currentValue !== '' || row.length > 0) {
                row.push(currentValue.trim());
                if (row.length >= 2 || row[0] !== '') parsed.push(row);
            }
            
            if (parsed.length > 0) {
                const headerTest = parsed[0][0].toLowerCase();
                if (headerTest.includes('正面') || headerTest.includes('word') || headerTest.includes('單字')) {
                    parsed.shift();
                }
                if (parsed.length > 0) fullDeck = parsed;
            }
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startGame(limit) {
            practiceLimit = limit;
            if (fullDeck.length === 0) return;
            
            startPractice();
            
            homeScreen.style.opacity = '0';
            setTimeout(() => {
                homeScreen.style.display = 'none';
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
            }, 700);
        }

        function startPractice() {
            let deckToUse = shuffleArray([...fullDeck]);
            
            if (practiceLimit > 0 && practiceLimit < deckToUse.length) {
                deckToUse = deckToUse.slice(0, practiceLimit);
            }

            queue = [...deckToUse];
            totalCards = queue.length; // 這是總目標
            learnedCards = 0;          // 目前進度 0
            stats = { again: 0, hard: 0, good: 0, easy: 0 };
            cardHistory = {};

            accumulatedTime = 0;
            sessionStartTime = Date.now();
            
            updateStatsUI();
            nextCard();
        }

        function rateCard(rating) {
            if (queue.length === 0) return;
            const card = queue.shift();
            const word = card[0];
            
            if (!cardHistory[word]) {
                cardHistory[word] = { againCount: 0, hardCount: 0, goodCount: 0 };
            }
            const history = cardHistory[word];
            
            if (rating === 1) { 
                // Again：插回第 2 個位置 (進度不變)
                stats.again++;
                history.againCount++;
                queue.splice(1, 0, card);
            } else if (rating === 2) { 
                // Hard：插回中間位置 (進度不變)
                stats.hard++;
                history.hardCount++;
                const midIndex = Math.floor(queue.length / 2);
                queue.splice(midIndex, 0, card);
            } else if (rating === 3) { 
                // Good：學會了！移出佇列，進度 + 1
                stats.good++;
                learnedCards++;
            } else if (rating === 4) { 
                // Easy：太簡單了！移出佇列，進度 + 1
                stats.easy++;
                learnedCards++;
            }
            
            updateStatsUI();
            nextCard(); // 會在這裡自動觸發 updateProgress 和 saveSession
        }

            const progressPct = totalCards === 0 ? 0 : (learnedCards / totalCards) * 100;
            progressBar.style.width = `${progressPct}%`;
        }

        function updateStatsUI() {
            document.getElementById('countAgain').textContent = stats.again;
            document.getElementById('countHard').textContent = stats.hard;
            document.getElementById('countGood').textContent = stats.good;
            document.getElementById('countEasy').textContent = stats.easy;
        }

        function saveHistoryRecord(count, timeStr) {
            let history = JSON.parse(localStorage.getItem('eng_flashcards_history') || '[]');
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            history.unshift({ date: dateStr, count: count, time: timeStr });
            if (history.length > 20) history = history.slice(0, 20); // 最多保留 20 筆
            localStorage.setItem('eng_flashcards_history', JSON.stringify(history));
        }

        function showCompletion() {
            // 計算最終花費時間 (含接續前的時間)
            const currentElapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const totalSeconds = accumulatedTime + currentElapsed;
            
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const timeStr = `${mins}分 ${secs}秒`;
            
            document.getElementById('timeSpentText').textContent = timeStr;
            saveHistoryRecord(totalCards, timeStr);

            completionModal.classList.remove('hidden');
            completionModal.classList.add('flex');
            
            progressBar.style.width = '100%';
            cardCounter.textContent = `${totalCards} / ${totalCards}`;
            clearSession(); 
        }

        //        // 遊玩紀錄 Modal
        document.getElementById('historyBtn').addEventListener('click', () => {
            if(queue.length > 0 && currentCard) saveSession(); // 打開紀錄前先備份一次進度
            isModalOpen = true;
            renderHistory();
            historyModal.classList.remove('hidden');
            setTimeout(() => {
                historyModal.classList.add('opacity-100');
                historyModalContent.classList.remove('scale-95');
                historyModalContent.classList.add('scale-100');
            }, 10);
        });

        function closeHistory() {
            historyModal.classList.remove('opacity-100');
            historyModalContent.classList.remove('scale-100');
            historyModalContent.classList.add('scale-95');
            setTimeout(() => {
                historyModal.classList.add('hidden');
                isModalOpen = false;
            }, 200);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('eng_flashcards_history') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 py-6 font-medium">尚無遊玩紀錄<br><span class="text-xs">快去完成一場挑戰吧！</span></div>';
                return;
            }
            
            list.innerHTML = history.map(record => `
                <div class="bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-xl p-3 flex justify-between items-center transition-colors">
                    <div class="text-sm font-bold text-gray-700">${record.date}</div>
                    <div class="flex gap-2 text-xs font-bold">
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-lg border border-blue-200">💪 ${record.count} 字</span>
                        <span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg border border-emerald-200">⏱️ ${record.time}</span>
                    </div>
                </div>
            `).join('');
        }

        // 說明 Modal
        document.getElementById('infoBtn').addEventListener('click', () => {
            isModalOpen = true;
            infoModal.classList.remove('hidden');
            setTimeout(() => {
                infoModal.classList.add('opacity-100');
                infoModalContent.classList.remove('scale-95');
                infoModalContent.classList.add('scale-100');
            }, 10);
        });

        function closeInfo() {
            infoModal.classList.remove('opacity-100');
            infoModalContent.classList.remove('scale-100');
            infoModalContent.classList.add('scale-95');
            setTimeout(() => {
                infoModal.classList.add('hidden');
                isModalOpen = false;
            }, 200);
        }

        // 點擊翻卡與發音
        flashcard.addEventListener('click', () => {
            if (!currentCard || isFlipped || isModalOpen) return;
            flipCard();
        });

        document.getElementById('frontSpeakBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentCard) speak(currentCard[0]);
        });

        function flipCard() {
            isFlipped = true;
            flashcard.classList.add('rotate-y-180');
            controlsContainer.classList.remove('hidden');
            showAnswerText.classList.add('hidden');
            renderCard(); 
        }

        // 背景圖備援載入
        function loadBackgroundImage() {
            const homeScreen = document.getElementById('homeScreen');
            const bgUrls = [
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.jpg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/title.jpg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.png',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.PNG'
            ];
            
            let currentIdx = 0;
            function tryNext() {
                if (currentIdx >= bgUrls.length) return; 
                const img = new Image();
                img.onload = () => { homeScreen.style.backgroundImage = `url('${bgUrls[currentIdx]}')`; };
                img.onerror = () => { currentIdx++; tryNext(); };
                img.src = bgUrls[currentIdx];
            }
            tryNext();
        }

        // 初始載入與快捷鍵綁定
        window.addEventListener('DOMContentLoaded', () => {
            loadBackgroundImage();
            if (typeof builtInCSV !== 'undefined' && builtInCSV.trim() !== '') {
                parseCSV(builtInCSV);
            }
            if (localStorage.getItem('eng_flashcards_session')) {
                resumeBtn.classList.remove('hidden');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (isModalOpen) {
                if (e.code === 'Escape') {
                    closeInfo();
                    closeHistory();
                }
                return;
            }
            if (queue.length === 0) return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (!isFlipped) flipCard();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                if (!isFlipped) {
                    document.getElementById('frontSpeakBtn').click();
                } else {
                    const backBtn = document.getElementById('backSpeakBtn');
                    if (backBtn) backBtn.click();
                }
            } else if (isFlipped) {
                if (e.key === '1') rateCard(1);
                else if (e.key === '2') rateCard(2);
                else if (e.key === '3') rateCard(3);
                else if (e.key === '4') rateCard(4);
            }
        });
    </script>
</body>
</html>
