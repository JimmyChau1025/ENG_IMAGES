    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .progress-transition { transition: width 0.3s ease-in-out; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-press { transition: transform 0.1s, box-shadow 0.1s; }
        .btn-press:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent; }

        /* 卡底動態背景動畫 */
        @keyframes floatShape {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-400px) scale(1.5) rotate(360deg); opacity: 0; }
        }
        /* 星星專屬閃爍動畫 */
        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.3; transform: scale(0.8) rotate(15deg); }
        }
        .animate-twinkle { animation: twinkle 1.5s ease-in-out infinite; }
        .animate-twinkle-delayed { animation: twinkle 1.5s ease-in-out infinite; animation-delay: 0.7s; }
        .floating-shape {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            animation: floatShape infinite linear;
            pointer-events: none;
        }
        .shape-1 { width: 60px; height: 60px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .shape-2 { width: 40px; height: 40px; left: 30%; animation-duration: 6s; animation-delay: 2s; }
        .shape-3 { width: 80px; height: 80px; left: 60%; animation-duration: 10s; animation-delay: 1s; }
        .shape-4 { width: 30px; height: 30px; left: 80%; animation-duration: 7s; animation-delay: 3s; }
        .shape-5 { width: 50px; height: 50px; left: 45%; animation-duration: 9s; animation-delay: 4s; }
        
        /* 結算卡片 Q 彈彈出動畫 */
        @keyframes popInBounce {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popInBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* 全螢幕撒花掉落動畫 */
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) translateX(20px) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: -10%;
            z-index: 9999;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
        }
    </style>

    <script>
        const synth = window.speechSynthesis;

        // ==========================================
        // 🚀 核心技術：IndexedDB 背景安裝引擎 (零時差圖片)
        // ==========================================
        let db;
        function initDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open('EngFlashcardsDB', 1);
                req.onupgradeneeded = (e) => {
                    if (!e.target.result.objectStoreNames.contains('images')) {
                        e.target.result.createObjectStore('images');
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(true); };
                req.onerror = () => { console.warn('IndexedDB failed'); resolve(false); };
            });
        }

        function saveImageToDB(key, blob) {
            if (!db) return;
            try {
                const tx = db.transaction('images', 'readwrite');
                tx.objectStore('images').put(blob, key);
            } catch(e) {}
        }

        function getImageFromDB(key) {
            return new Promise((resolve) => {
                if (!db) return resolve(null);
                try {
                    const tx = db.transaction('images', 'readonly');
                    const req = tx.objectStore('images').get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            });
        }

        async function downloadAllImagesSilently() {
            if (!fullDeck || fullDeck.length === 0) return;

            const indicator = document.createElement('div');
            indicator.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur text-blue-700 text-xs font-bold px-3 py-1.5 rounded-full shadow-md z-50 flex items-center gap-2 border border-blue-100 transition-opacity duration-500';
            indicator.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> <span id="dlProgress">正在將圖庫安裝至本機 0%</span>';
            document.body.appendChild(indicator);

            let downloaded = 0;
            const total = fullDeck.length + 1; 

            const fetchAndSave = async (keyword, urls) => {
                const exists = await getImageFromDB(keyword);
                if (exists) return true; 

                for (const url of urls) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const blob = await res.blob();
                            saveImageToDB(keyword, blob);
                            return true;
                        }
                    } catch(e) {}
                }
                return false;
            };

            await fetchAndSave('ENDGAME', [
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.png',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpg'
            ]);
            downloaded++;

            for (const card of fullDeck) {
                const word = card[0];
                const trimmed = word.trim();
                const keyword = encodeURIComponent(trimmed);
                const lowerKeyword = encodeURIComponent(trimmed.toLowerCase());

                const urls = [
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.png`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpeg`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpg`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.png`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpg`
                ];

                await fetchAndSave(keyword, urls);
                downloaded++;
                const pct = Math.floor((downloaded / total) * 100);
                document.getElementById('dlProgress').textContent = `正在將圖庫安裝至本機 ${pct}%`;
            }

            indicator.innerHTML = '<i class="ph-fill ph-check-circle text-emerald-500 text-lg"></i> <span class="text-emerald-700">圖庫已成功安裝至本機！</span>';
            setTimeout(() => {
                indicator.classList.add('opacity-0');
                setTimeout(() => indicator.remove(), 500);
            }, 3000);
        }

        function handleImageError(img) {
            const cleanWord = img.dataset.word;
            if (!cleanWord) {
                img.style.display = 'none'; return;
            }
            const trimmed = cleanWord.trim();
            const keyword = encodeURIComponent(trimmed);
            const lowerKeyword = encodeURIComponent(trimmed.toLowerCase());
            
            const rawUrls = [
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpeg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.png`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpeg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.png`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpg`
            ];
            
            const urls = [...new Set(rawUrls)];
            let idx = parseInt(img.dataset.fallbackIndex || '0');
            idx++;
            
            if (idx < urls.length) {
                img.dataset.fallbackIndex = idx;
                img.src = urls[idx];
            } else {
                img.style.display = 'none';
            }
        }

        // ==========================================
        // 🍎 您的專屬字庫 (已經包含 occupation 到 registration)
        // ==========================================
        const builtInCSV = `
正面,背面
Practical,"Practical (adj.) 實用的、實際的
