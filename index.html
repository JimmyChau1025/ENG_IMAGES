    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .progress-transition { transition: width 0.3s ease-in-out; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-press { transition: transform 0.1s, box-shadow 0.1s; }
        .btn-press:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent; }

        /* 卡底動態背景動畫 */
        @keyframes floatShape {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-400px) scale(1.5) rotate(360deg); opacity: 0; }
        }
        /* 星星專屬閃爍動畫 */
        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.3; transform: scale(0.8) rotate(15deg); }
        }
        .animate-twinkle { animation: twinkle 1.5s ease-in-out infinite; }
        .animate-twinkle-delayed { animation: twinkle 1.5s ease-in-out infinite; animation-delay: 0.7s; }
        .floating-shape {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            animation: floatShape infinite linear;
            pointer-events: none;
        }
        .shape-1 { width: 60px; height: 60px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .shape-2 { width: 40px; height: 40px; left: 30%; animation-duration: 6s; animation-delay: 2s; }
        .shape-3 { width: 80px; height: 80px; left: 60%; animation-duration: 10s; animation-delay: 1s; }
        .shape-4 { width: 30px; height: 30px; left: 80%; animation-duration: 7s; animation-delay: 3s; }
        .shape-5 { width: 50px; height: 50px; left: 45%; animation-duration: 9s; animation-delay: 4s; }
        
        /* 結算卡片 Q 彈彈出動畫 */
        @keyframes popInBounce {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popInBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* 全螢幕撒花掉落動畫 */
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) translateX(20px) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: -10%;
            z-index: 9999;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
        }
    </style>

    <script>
        const synth = window.speechSynthesis;

        // ==========================================
        // 🚀 核心技術：IndexedDB 背景安裝引擎 (零時差圖片)
        // ==========================================
        let db;
        function initDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open('EngFlashcardsDB', 1);
                req.onupgradeneeded = (e) => {
                    if (!e.target.result.objectStoreNames.contains('images')) {
                        e.target.result.createObjectStore('images');
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(true); };
                req.onerror = () => { console.warn('IndexedDB failed'); resolve(false); };
            });
        }

        function saveImageToDB(key, blob) {
            if (!db) return;
            try {
                const tx = db.transaction('images', 'readwrite');
                tx.objectStore('images').put(blob, key);
            } catch(e) {}
        }

        function getImageFromDB(key) {
            return new Promise((resolve) => {
                if (!db) return resolve(null);
                try {
                    const tx = db.transaction('images', 'readonly');
                    const req = tx.objectStore('images').get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            });
        }

        async function downloadAllImagesSilently() {
            if (!fullDeck || fullDeck.length === 0) return;

            const indicator = document.createElement('div');
            indicator.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur text-blue-700 text-xs font-bold px-3 py-1.5 rounded-full shadow-md z-50 flex items-center gap-2 border border-blue-100 transition-opacity duration-500';
            indicator.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> <span id="dlProgress">正在將圖庫安裝至本機 0%</span>';
            document.body.appendChild(indicator);

            let downloaded = 0;
            const total = fullDeck.length + 1; 

            const fetchAndSave = async (keyword, urls) => {
                const exists = await getImageFromDB(keyword);
                if (exists) return true; 

                for (const url of urls) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const blob = await res.blob();
                            saveImageToDB(keyword, blob);
                            return true;
                        }
                    } catch(e) {}
                }
                return false;
            };

            await fetchAndSave('ENDGAME', [
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.png',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpg'
            ]);
            downloaded++;

            for (const card of fullDeck) {
                const word = card[0];
                const trimmed = word.trim();
                const keyword = encodeURIComponent(trimmed);
                const lowerKeyword = encodeURIComponent(trimmed.toLowerCase());

                const urls = [
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.png`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpeg`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpg`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.png`,
                    `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpg`
                ];

                await fetchAndSave(keyword, urls);
                downloaded++;
                const pct = Math.floor((downloaded / total) * 100);
                document.getElementById('dlProgress').textContent = `正在將圖庫安裝至本機 ${pct}%`;
            }

            indicator.innerHTML = '<i class="ph-fill ph-check-circle text-emerald-500 text-lg"></i> <span class="text-emerald-700">圖庫已成功安裝至本機！</span>';
            setTimeout(() => {
                indicator.classList.add('opacity-0');
                setTimeout(() => indicator.remove(), 500);
            }, 3000);
        }

        function handleImageError(img) {
            const cleanWord = img.dataset.word;
            if (!cleanWord) {
                img.style.display = 'none'; return;
            }
            const trimmed = cleanWord.trim();
            const keyword = encodeURIComponent(trimmed);
            const lowerKeyword = encodeURIComponent(trimmed.toLowerCase());
            
            const rawUrls = [
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpeg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.png`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.jpg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpeg`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.png`,
                `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${lowerKeyword}.jpg`
            ];

        // ==========================================
        // APP 運作邏輯
        // ==========================================
        let fullDeck = []; 
        let queue = [];
        let currentCard = null;
        let isFlipped = false;
        
        let totalCards = 0;       
        let learnedCards = 0;     
        let practiceLimit = 0;
        
        let stats = { hard: 0, good: 0, easy: 0 };
        let cardHistory = {}; 
        let isModalOpen = false;
        
        let sessionStartTime = 0;
        let accumulatedTime = 0; 
        
        const flashcard = document.getElementById('flashcard');
        const controlsContainer = document.getElementById('controlsContainer');
        const showAnswerText = document.getElementById('showAnswerText');
        const progressBar = document.getElementById('progressBar');
        const cardCounter = document.getElementById('cardCounter');
        
        const infoModal = document.getElementById('infoModal');
        const infoModalContent = document.getElementById('infoModalContent');
        const completionModal = document.getElementById('completionModal');
        const historyModal = document.getElementById('historyModal');
        const historyModalContent = document.getElementById('historyModalContent');
        const appContainer = document.getElementById('appContainer');
        const homeScreen = document.getElementById('homeScreen');
        const resumeBtn = document.getElementById('resumeBtn');

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function saveSession() {
            if (queue.length === 0 && !currentCard) return;
            const currentElapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            
            const state = {
                queue: queue,
                totalCards: totalCards,
                learnedCards: learnedCards, 
                stats: stats,
                practiceLimit: practiceLimit,
                fullDeck: fullDeck,
                cardHistory: cardHistory,
                accumulatedTime: accumulatedTime + currentElapsed 
            };
            localStorage.setItem('eng_flashcards_session', JSON.stringify(state));
        }

        function loadSession() {
            const saved = localStorage.getItem('eng_flashcards_session');
            if (saved) {
                const state = JSON.parse(saved);
                queue = state.queue;
                totalCards = state.totalCards;
                learnedCards = state.learnedCards || 0;
                stats = state.stats;
                
                if(stats.hard === undefined) stats = { hard: 0, good: 0, easy: 0 };
                
                practiceLimit = state.practiceLimit;
                fullDeck = state.fullDeck;
                cardHistory = state.cardHistory || {};
                
                accumulatedTime = state.accumulatedTime || 0;
                sessionStartTime = Date.now();
                
                homeScreen.style.opacity = '0';
                setTimeout(() => {
                    homeScreen.style.display = 'none';
                    appContainer.classList.remove('hidden');
                    appContainer.classList.add('flex');
                    updateStatsUI();
                    nextCard();
                }, 700);
            }
        }

        function clearSession() {
            localStorage.removeItem('eng_flashcards_session');
        }

        function parseCSV(text) {
            let parsed = [];
            let row = [];
            let inQuotes = false;
            let currentValue = '';

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i+1];
                if (char === '"' && inQuotes && nextChar === '"') {
                    currentValue += '"'; i++; 
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue.trim());
                    currentValue = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++; 
                    row.push(currentValue.trim());
                    if (row.length >= 2 || row[0] !== '') parsed.push(row);
                    row = [];
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            if (currentValue !== '' || row.length > 0) {
                row.push(currentValue.trim());
                if (row.length >= 2 || row[0] !== '') parsed.push(row);
            }
            
            if (parsed.length > 0) {
                const headerTest = parsed[0][0].toLowerCase();
                if (headerTest.includes('正面') || headerTest.includes('word') || headerTest.includes('單字')) {
                    parsed.shift();
                }
                if (parsed.length > 0) fullDeck = parsed;
            }
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startGame(limit) {
            practiceLimit = limit;
            if (fullDeck.length === 0) return;
            
            startPractice();
            
            homeScreen.style.opacity = '0';
            setTimeout(() => {
                homeScreen.style.display = 'none';
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
            }, 700);
        }

        function startPractice() {
            let deckToUse = shuffleArray([...fullDeck]);
            
            if (practiceLimit > 0 && practiceLimit < deckToUse.length) {
                deckToUse = deckToUse.slice(0, practiceLimit);
            }

            queue = [...deckToUse];
            totalCards = queue.length; 
            learnedCards = 0;          
            stats = { hard: 0, good: 0, easy: 0 }; 
            cardHistory = {};
            
            accumulatedTime = 0;
            sessionStartTime = Date.now();
            
            updateStatsUI();
            nextCard();
        }

function nextCard() {
            if (queue.length === 0) {
                showCompletion();
                return;
            }
            isFlipped = false;
            flashcard.classList.remove('rotate-y-180');
            controlsContainer.classList.add('hidden');
            showAnswerText.classList.remove('hidden');
            
            // --- 隨機設定卡面背景圖 ---
            const cardFront = document.getElementById('cardFront');
            if (cardFront) {
                const isMobile = window.innerWidth < 640;
                const randomNum = Math.floor(Math.random() * 6) + 1; 
                const prefix = isMobile ? 'bgm' : 'bg';
                const bgUrl = `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${prefix}${randomNum}.jpeg`;
                cardFront.style.backgroundImage = `url('${bgUrl}')`;
            }
            // ---------------------------------
            
            currentCard = queue[0];
            const word = currentCard[0];
            const detailsRaw = currentCard[1] || '';
            
            const mode = Math.floor(Math.random() * 3);
            const frontSpeakBtn = document.getElementById('frontSpeakBtn');
            const cardFrontText = document.getElementById('cardFrontText');
            
            // 設定新的按鈕樣式：手機版在右下角，平板/電腦版垂直置中，並設定 z-50
            const btnResponsiveStyle = "absolute top-auto bottom-20 right-2 sm:top-1/2 sm:-translate-y-1/2 sm:bottom-auto sm:right-6 p-3 text-blue-600 hover:bg-white/60 rounded-full transition-all z-50 drop-shadow-md cursor-pointer";
            
            if (mode === 0) {
                cardFrontText.style.display = 'block';
                cardFrontText.innerHTML = word;
                frontSpeakBtn.className = btnResponsiveStyle;
                frontSpeakBtn.innerHTML = '<i class="ph-fill ph-speaker-high text-5xl sm:text-6xl"></i>';
            } else if (mode === 1) {
                cardFrontText.style.display = 'block';
                let firstLine = detailsRaw.split('\n').find(line => line.trim() !== '') || '無解釋';
                const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                
                // --- 移除底線，改成前後加花朵 ---
                let hintOnly = firstLine.replace(new RegExp(escapedWord, 'gi'), '').trim();
                let chineseHint = `🌸 ${hintOnly} 🌸`;
                // ------------------------------------------
                
                cardFrontText.innerHTML = `<span class="text-3xl sm:text-4xl lg:text-5xl text-gray-700 leading-snug font-bold">${chineseHint}</span>`;
                frontSpeakBtn.className = btnResponsiveStyle;
                frontSpeakBtn.innerHTML = '<i class="ph-fill ph-speaker-high text-5xl sm:text-6xl"></i>';              
            } else if (mode === 2) {
                cardFrontText.style.display = 'none';
                frontSpeakBtn.className = "absolute inset-0 m-auto w-32 h-32 flex items-center justify-center bg-blue-50 text-blue-500 hover:bg-blue-100 rounded-full transition-transform transform hover:scale-110 shadow-xl z-50 cursor-pointer";
                frontSpeakBtn.innerHTML = '<i class="ph-fill ph-speaker-high text-7xl"></i>';
                setTimeout(() => speak(word), 400);
            }
            
            document.getElementById('cardBackContent').innerHTML = '';
            updateProgress();
            saveSession();
        }

        function renderCard() {
            if (!currentCard) return;
            const word = currentCard[0];
            const detailsRaw = currentCard[1] || '';
            const keyword = encodeURIComponent(word.trim());
            const cardBackContent = document.getElementById('cardBackContent');
            
            let backHTML = `
                <div class="flex flex-col sm:flex-row w-full h-full">
                    <div class="w-full sm:w-1/2 h-48 sm:h-full shrink-0 bg-white/40 backdrop-blur-sm flex items-center justify-center p-2 rounded-t-2xl sm:rounded-l-2xl sm:rounded-tr-none border-b sm:border-b-0 sm:border-r border-pink-100/50">
                        <img id="dynamicCardImage" 
                             data-word="${word}"
                             data-fallback-index="0"
                             onerror="handleImageError(this)" 
                             alt="${word}" 
                             src=""
                             class="w-full h-full object-contain aspect-[1024/559] rounded-lg shadow-sm mix-blend-multiply">
                    </div>
                    <div class="w-full sm:w-1/2 flex-1 flex flex-col p-4 sm:p-6 overflow-y-auto hide-scrollbar text-base sm:text-lg relative text-left">
                        <h2 class="text-3xl font-bold text-gray-800 mb-3 border-b border-pink-200 pb-1">${word}</h2>
            `;
            
            const lines = detailsRaw.split('\n');
            lines.forEach(line => {
                let trimmedLine = line.trim();
                if (!trimmedLine) return;
                
                if (trimmedLine.startsWith('【')) {
                    backHTML += `<h3 class="font-bold text-gray-600 mt-3 mb-1 text-sm bg-gray-100 inline-block px-2 py-0.5 rounded">${trimmedLine}</h3>`;
                } else if (trimmedLine.match(/^[a-zA-Z]/)) {
                    backHTML += `<p class="text-blue-600 font-medium my-1">${trimmedLine}</p>`;
                } else {
                    backHTML += `<p class="text-gray-700 my-1">${trimmedLine}</p>`;
                }
            });
            
            backHTML += `</div></div>`;
            cardBackContent.innerHTML = backHTML;
            
            const imgEl = document.getElementById('dynamicCardImage');
            getImageFromDB(keyword).then(blob => {
                if (blob) {
                    imgEl.src = URL.createObjectURL(blob); 
                } else {
                    imgEl.src = `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/${keyword}.png`;
                }
            });
            
            const backSpeakBtn = document.getElementById('backSpeakBtn');
            if (backSpeakBtn) {
                backSpeakBtn.onclick = (e) => {
                    e.stopPropagation();
                    speak(word);
                };
            }
        }

        function rateCard(rating) {
            if (queue.length === 0) return;
            const card = queue.shift();
            const word = card[0];
            
            if (!cardHistory[word]) {
                cardHistory[word] = { hardCount: 0, goodCount: 0 };
            }
            const history = cardHistory[word];
            
            if (rating === 1) { 
                stats.hard++;
                history.hardCount++;
                const midIndex = Math.floor(queue.length / 2);
                queue.splice(midIndex, 0, card);
            } else if (rating === 2) { 
                stats.good++;
                learnedCards++;
            } else if (rating === 3) { 
                stats.easy++;
                learnedCards++;
            }
            
            updateStatsUI();
            nextCard(); 
        }

        function updateProgress() {
            cardCounter.textContent = `${learnedCards} / ${totalCards}`;
            const progressPct = totalCards === 0 ? 0 : (learnedCards / totalCards) * 100;
            progressBar.style.width = `${progressPct}%`;
        }

        function updateStatsUI() {
            document.getElementById('countHard').textContent = stats.hard || 0;
            document.getElementById('countGood').textContent = stats.good || 0;
            document.getElementById('countEasy').textContent = stats.easy || 0;
        }

        function saveHistoryRecord(count, timeStr) {
            let history = JSON.parse(localStorage.getItem('eng_flashcards_history') || '[]');
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            history.unshift({ date: dateStr, count: count, time: timeStr });
            if (history.length > 20) history = history.slice(0, 20); 
            localStorage.setItem('eng_flashcards_history', JSON.stringify(history));
        }

        function fireConfetti() {
            const emojis = ['🌸', '✨', '🎉', '🎊', '⭐', '🌼'];
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-piece';
                    confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
                    confetti.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 60); 
            }
        }

        function showCompletion() {
            const currentElapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const totalSeconds = accumulatedTime + currentElapsed;
            
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const timeStr = `${mins}分 ${secs}秒`;
            
            document.getElementById('timeSpentText').textContent = timeStr;
            saveHistoryRecord(totalCards, timeStr);

            const endgameImg = document.getElementById('endgameImage');
            getImageFromDB('ENDGAME').then(blob => {
                if (blob) {
                    endgameImg.src = URL.createObjectURL(blob);
                } else {
                    endgameImg.src = `https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/ENDGAME.jpeg?v=${Date.now()}`;
                }
            });

            const completionModal = document.getElementById('completionModal');
            completionModal.classList.remove('hidden');
            completionModal.classList.add('flex');
            
            fireConfetti();
            
            progressBar.style.width = '100%';
            cardCounter.textContent = `${totalCards} / ${totalCards}`;
            clearSession(); 
        }

        document.getElementById('historyBtn').addEventListener('click', () => {
            if(queue.length > 0 && currentCard) saveSession(); 
            isModalOpen = true;
            renderHistory();
            historyModal.classList.remove('hidden');
            setTimeout(() => {
                historyModal.classList.add('opacity-100');
                historyModalContent.classList.remove('scale-95');
                historyModalContent.classList.add('scale-100');
            }, 10);
        });

        function closeHistory() {
            historyModal.classList.remove('opacity-100');
            historyModalContent.classList.remove('scale-100');
            historyModalContent.classList.add('scale-95');
            setTimeout(() => {
                historyModal.classList.add('hidden');
                isModalOpen = false;
            }, 200);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('eng_flashcards_history') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 py-6 font-medium">尚無遊玩紀錄<br><span class="text-xs">快去完成一場挑战吧！</span></div>';
                return;
            }
            
            list.innerHTML = history.map(record => `
                <div class="bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-xl p-3 flex justify-between items-center transition-colors">
                    <div class="text-sm font-bold text-gray-700">${record.date}</div>
                    <div class="flex gap-2 text-xs font-bold">
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-lg border border-blue-200">💪 ${record.count} 字</span>
                        <span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg border border-emerald-200">⏱️ ${record.time}</span>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('infoBtn').addEventListener('click', () => {
            isModalOpen = true;
            infoModal.classList.remove('hidden');
            setTimeout(() => {
                infoModal.classList.add('opacity-100');
                infoModalContent.classList.remove('scale-95');
                infoModalContent.classList.add('scale-100');
            }, 10);
        });

        function closeInfo() {
            infoModal.classList.remove('opacity-100');
            infoModalContent.classList.remove('scale-100');
            infoModalContent.classList.add('scale-95');
            setTimeout(() => {
                infoModal.classList.add('hidden');
                isModalOpen = false;
            }, 200);
        }

        flashcard.addEventListener('click', () => {
            if (!currentCard || isFlipped || isModalOpen) return;
            flipCard();
        });

        document.getElementById('frontSpeakBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentCard) speak(currentCard[0]);
        });

        function flipCard() {
            isFlipped = true;
            flashcard.classList.add('rotate-y-180');
            controlsContainer.classList.remove('hidden');
            showAnswerText.classList.add('hidden');
            renderCard(); 
        }

        function loadBackgroundImage() {
            const homeScreen = document.getElementById('homeScreen');
            
            const isMobile = window.innerWidth < 640;

            const desktopBgUrls = [
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.jpg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/title.jpg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.png',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE.PNG'
            ];

            const mobileBgUrls = [
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE_MOBILE.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE_MOBILE.jpg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/title_mobile.jpeg',
                'https://raw.githubusercontent.com/JimmyChau1025/ENG_IMAGES/main/TITLE_MOBILE.png'
            ];

            const bgUrls = isMobile ? mobileBgUrls : desktopBgUrls;
            
            let currentIdx = 0;
            function tryNext() {
                if (currentIdx >= bgUrls.length) return; 
                const img = new Image();
                img.onload = () => { homeScreen.style.backgroundImage = `url('${bgUrls[currentIdx]}')`; };
                img.onerror = () => { currentIdx++; tryNext(); };
                img.src = bgUrls[currentIdx];
            }
            tryNext();

            window.addEventListener('resize', () => {
                const newIsMobile = window.innerWidth < 640;
                if (isMobile !== newIsMobile) {
                   location.reload(); 
                }
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            loadBackgroundImage();
            
            if (typeof builtInCSV !== 'undefined' && builtInCSV.trim() !== '') {
                parseCSV(builtInCSV);
            }
            
            if (localStorage.getItem('eng_flashcards_session')) {
                resumeBtn.classList.remove('hidden');
            }

            await initDB();
            setTimeout(() => {
                downloadAllImagesSilently();
            }, 2000);
        });

        document.addEventListener('keydown', (e) => {
            if (isModalOpen) {
                if (e.code === 'Escape') {
                    closeInfo();
                    closeHistory();
                }
                return;
            }
            if (queue.length === 0) return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (!isFlipped) flipCard();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                if (!isFlipped) {
                    document.getElementById('frontSpeakBtn').click();
                } else {
                    const backBtn = document.getElementById('backSpeakBtn');
                    if (backBtn) backBtn.click();
                }
            } else if (isFlipped) {
                if (e.key === '1') rateCard(1);
                else if (e.key === '2') rateCard(2);
                else if (e.key === '3') rateCard(3);
            }
        });
    </script>
